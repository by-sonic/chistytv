name: CleanYourTV launcher on Android TV 11
on:
  push:
    branches: [qa/embedded-clean-home]
    paths: ['data/CleanYourTV-Launcher-3.6.apk', 'qa/home.py', '.github/workflows/clean-home.yml']
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          script: python3 qa/home.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-on-tv-screen
          path: clean-home.png
