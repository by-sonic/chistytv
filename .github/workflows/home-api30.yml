name: Released Android TV 11 HOME restore
on:
  push:
    branches: [qa/issue-replay-20261122]
    paths: ['qa/LiveHomeTest.kt', '.github/workflows/home-api30.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the release under test
        uses: actions/checkout@v4
        with:
          ref: 5177ced6db02e2411737dfd55190f7a509721698
          path: released
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the focused test on the release source
        run: cp qa/LiveHomeTest.kt released/android/core/src/test/kotlin/ru/bysonic/chistytv/core/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          script: bash released/android/gradlew -p released/android :core:test --tests '*LiveHomeTest*' --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-home-test-results
          path: released/android/core/build/test-results/test/*.xml
