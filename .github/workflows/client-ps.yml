name: Integrated PowerShell launcher install on Android TV
on:
  push:
    branches: [qa/embedded-clean-home]
    paths: ['qa/client-ps.py', '.github/workflows/client-ps.yml']
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 447c62f3f56072c7eb94fa06ab2333350caefcf6
          path: candidate
      - name: Prepare interactive console test
        run: python3 -m pip install --quiet pexpect==4.9.0
      - name: Enable the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          script: python3 qa/client-ps.py
