name: Released ChistyTV launcher installation screen
on:
  push:
    branches: [qa/embedded-clean-home]
    paths: ['qa/app-ui.py', '.github/workflows/client-launcher.yml']
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published installer
        run: |
          curl -fsSL --retry 3 https://github.com/by-sonic/chistytv/releases/download/android-v1.0.9/ChistyTV.apk -o client.apk
          echo 'fd7eebe1d4c45848a2c87da66c686dde717b150066df12c6a08d99443ea1207a  client.apk' | sha256sum -c -
      - name: Enable the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          script: BASELINE=yes python3 qa/app-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-ui
          path: ui-evidence
